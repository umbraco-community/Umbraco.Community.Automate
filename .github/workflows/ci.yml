name: CI

# Single entry point, so release.yml still gates on one `uses: ./.github/workflows/ci.yml`
# and adding a package never means editing release.yml.
#
# Packages are discovered from the folder layout rather than listed here, so a new package
# needs no change to this file at all: drop it in following the existing convention
# (<Area>/Umbraco.Community.Automate.<Area>/ with a sibling .Tests project) and it is picked
# up on the next run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  discover:
    name: Discover affected packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      any: ${{ steps.discover.outputs.any }}
    steps:
      # Full history so the merge-base diff below can see the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover packages and work out which are affected
        id: discover
        run: |
          set -euo pipefail

          # A package is any directory with its own Directory.Build.props — the same marker
          # release.yml already relies on to map a tag back to a package.
          mapfile -t PROJECT_DIRS < <(
            find . -mindepth 3 -maxdepth 3 -name Directory.Build.props -not -path './.git/*' \
              | xargs -r -n1 dirname | sed 's#^\./##' | sort
          )

          if [ ${#PROJECT_DIRS[@]} -eq 0 ]; then
            echo "Found no packages — expected at least one Directory.Build.props" >&2
            exit 1
          fi

          ALL='[]'
          AREAS=()

          for PROJECT_DIR in "${PROJECT_DIRS[@]}"; do
            AREA="${PROJECT_DIR%%/*}"                      # e.g. Mastodon
            TESTS_DIR="${PROJECT_DIR}.Tests"
            CLIENT_DIR=""
            RUN_E2E=false

            if [ ! -d "$TESTS_DIR" ]; then
              echo "Package '$PROJECT_DIR' has no test project at '$TESTS_DIR'" >&2
              exit 1
            fi

            # Optional frontend. Only packages with a Client folder get frontend jobs, and
            # only one with Playwright specs owns the E2E suite.
            if [ -d "$PROJECT_DIR/Client" ]; then
              CLIENT_DIR="$PROJECT_DIR/Client"
              if compgen -G "$CLIENT_DIR/tests/e2e/*.spec.ts" > /dev/null; then
                RUN_E2E=true
              fi
            fi

            AREAS+=("$AREA")
            ALL=$(jq -c \
              --arg name "$AREA" \
              --arg area "$AREA" \
              --arg project "$PROJECT_DIR" \
              --arg tests "$TESTS_DIR" \
              --arg client "$CLIENT_DIR" \
              --argjson e2e "$RUN_E2E" \
              '. + [{name: $name, area: $area, project: $project, tests: $tests, client: $client, e2e: $e2e}]' \
              <<< "$ALL")
          done

          echo "Discovered packages:"
          jq -r '.[] | "  \(.name)  project=\(.project)  client=\(.client // "-")  e2e=\(.e2e)"' <<< "$ALL"

          # Only a pull_request has a diff to narrow by. A tag build (release.yml calls this)
          # or a manual dispatch has no meaningful base, so everything runs.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} — running every package."
            echo "packages=$ALL" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)

          echo "Changed files:"
          sed 's/^/  /' <<< "$CHANGED"

          # Fail safe: anything NOT inside a package folder is treated as a shared change and
          # runs the lot. That covers Directory.Packages.props, the Demo site (which both
          # packages are referenced by), these workflows, and anything added in future —
          # without a hand-maintained list of shared paths to forget to update.
          SHARED=false
          AFFECTED_AREAS=()

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            MATCHED=false
            for AREA in "${AREAS[@]}"; do
              if [[ "$FILE" == "$AREA/"* ]]; then
                AFFECTED_AREAS+=("$AREA")
                MATCHED=true
                break
              fi
            done
            if [ "$MATCHED" = false ]; then
              echo "Shared change detected: $FILE"
              SHARED=true
              break
            fi
          done <<< "$CHANGED"

          if [ "$SHARED" = true ]; then
            echo "Shared file touched — running every package."
            SELECTED="$ALL"
          else
            UNIQUE=$(printf '%s\n' "${AFFECTED_AREAS[@]:-}" | sort -u | jq -R . | jq -s -c .)
            SELECTED=$(jq -c --argjson areas "$UNIQUE" '[.[] | select(.area as $a | $areas | index($a))]' <<< "$ALL")
            echo "Affected packages: $(jq -r '[.[].name] | join(", ") // "(none)"' <<< "$SELECTED")"
          fi

          COUNT=$(jq 'length' <<< "$SELECTED")
          echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    uses: ./.github/workflows/package-ci.yml
    with:
      name: ${{ matrix.package.name }}
      project-dir: ${{ matrix.package.project }}
      tests-dir: ${{ matrix.package.tests }}
      client-dir: ${{ matrix.package.client }}
      run-e2e: ${{ matrix.package.e2e }}

  # Single stable name to require in branch protection: it succeeds when every matrix leg
  # succeeded, and — unlike listing each leg — does not need updating as packages come and go.
  # Also covers the legitimately-nothing-to-do case, where `package` is skipped.
  ci:
    name: CI
    needs: [discover, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "discover: ${{ needs.discover.result }}"
          echo "package:  ${{ needs.package.result }}"

          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "Package discovery failed." >&2
            exit 1
          fi

          # 'skipped' is a pass: it means the diff touched no package.
          case "${{ needs.package.result }}" in
            success|skipped) echo "All good." ;;
            *) echo "One or more packages failed." >&2; exit 1 ;;
          esac
